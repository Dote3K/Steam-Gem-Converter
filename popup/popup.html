<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Gem Converter</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header><h1>Steam Gem Converter</h1></header>
  <main>
    <p id="status" role="status">Open your Steam Community inventory to convert items into gems.</p>
    <button id="load" type="button" disabled>Load inventory</button>
    <p id="counts">Inventory: 0 · Gemmable: 0</p>
    <label>Game<select id="game" disabled><option value="">Load inventory first</option></select></label>
    <div class="settings">
      <label>Delay (ms)<input id="delay" type="number" min="0" max="2147483647" step="1" value="50" required disabled></label>
      <label>Max items<input id="max-items" type="number" min="1" step="1" value="1000" placeholder="No limit" disabled></label>
    </div>
    <label class="checkbox"><input id="filter-enabled" type="checkbox" disabled>Only convert a selected item or type</label>
    <div id="filter-controls" hidden>
      <label>Filter by<select id="filter-mode" disabled><option value="item">Specific item</option><option value="type">Item type</option></select></label>
      <label>Selection<select id="filter-value" disabled></select></label>
    </div>
    <p id="selection-count">Selected: 0</p>
    <p class="warning">Converting items into gems is permanent.</p>
  </main>
</body>
</html>
